on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

name: Test debug ll generation

jobs:
  test-debug-ll-generation:
    runs-on: [ubuntu-24.04]
    timeout-minutes: 90
    env:
      LLVM_VERSION: 23
    steps:
      - uses: actions/checkout@v5

      - name: Check if CMakeLists.txt is in sync with our LLVM_VERSION
        run: |
          grep -q "set(DEBUGIR_LLVM_VERSION $LLVM_VERSION" CMakeLists.txt

      - name: Check if DebugIR.cpp is in sync with our LLVM_VERSION
        run: |
          grep -q "LLVM_VERSION_MAJOR < $LLVM_VERSION" DebugIR.cpp

      - name: Check if README is in sync with our LLVM_VERSION
        run: |
          grep -q "LLVM-$LLVM_VERSION" README.md

      - name: install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh $LLVM_VERSION
          # lit and FileCheck.
          sudo apt-get install -y llvm-$LLVM_VERSION-tools

      - name: build debugir
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Build with assertions for tests
      - name: run the tests
        run: |
          cmake -B build-assertions -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-assertions --target check
